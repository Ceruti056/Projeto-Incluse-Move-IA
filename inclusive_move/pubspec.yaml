name: inclusive_move
description: "InclusIMove - Transporte especializado para idosos e pessoas com deficiência. Mobilidade com dignidade."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Design ─────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # ── Firebase ─────────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # ── Gerenciamento de Estado ───────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navegação ────────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Mapas e Geolocalização ───────────────────────────────────────────────────
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_polyline_points: ^2.1.0

  # ── Chamadas e Comunicação ───────────────────────────────────────────────────
  url_launcher: ^6.3.0
  flutter_phone_direct_caller: ^2.1.1

  # ── Voz e Acessibilidade ─────────────────────────────────────────────────────
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2

  # ── HTTP / API (Grok AI) ──────────────────────────────────────────────────────
  http: ^1.2.2
  dio: ^5.7.0

  # ── Armazenamento Local ───────────────────────────────────────────────────────
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1

  # ── Notificações ─────────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ── Utilitários ──────────────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.2
  logger: ^2.4.0
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  equatable: ^2.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
